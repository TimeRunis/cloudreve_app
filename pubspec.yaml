name: "cloudreve_view"
description: "Cloudreve v4 Flutter client"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  gal: 2.2.1
  video_player: ^2.9.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  video_thumbnail: ^0.5.3
  wakelock_plus: ^1.2.8
  # 锁定 8.x：9.x 与当前 Flutter 3.24 的 Gradle 插件不兼容
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/pic.png
    - assets/images/start_bg.gif
